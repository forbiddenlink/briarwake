# Wait one week (in minutes) before resolving newly published packages, so a
# compromised release (e.g. the Shai-Hulud npm worm) is pulled before it reaches
# installs in CI or Vercel.
minimumReleaseAge: 10080
packages:
  - "."

overrides:
  esbuild: ">=0.25.0 <0.26.0"
  vite: ">=8.3.3 <9"
  rollup: ">=4.59.0 <5.0.0"
  flatted: ">=3.4.2 <4.0.0"
  picomatch: ">=4.0.4 <5.0.0"
  nanoid: "3.3.19"
